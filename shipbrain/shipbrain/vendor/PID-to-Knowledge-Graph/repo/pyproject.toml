[project]
name = "pid-to-kg"
version = "0.1.0"
description = "Claude skill that turns P&ID PDFs (vector or scanned) into a process knowledge graph"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pypdfium2>=4.30",
    "pillow>=10.0",
    "pydantic>=2.6",
    "duckdb>=1.1",
    "networkx>=3.2",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3; python_version < '3.13'"]
dev = ["pytest>=7.4", "rapidocr-onnxruntime>=1.3; python_version < '3.13'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
