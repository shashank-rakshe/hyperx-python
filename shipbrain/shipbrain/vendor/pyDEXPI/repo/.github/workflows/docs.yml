name: Deploy documentation

# Runs on the public repository, which is the only one that holds a GitHub Pages site. It is kept
# here with the other workflows, and publish.yml copies this one file there with each release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'process-intelligence-research/pyDEXPI'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Build the site
        run: |
          pip install ".[docs]"
          mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
