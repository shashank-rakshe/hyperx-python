site_name: DEXPI Studio
site_description: A PySide6 desktop GUI companion for pyDEXPI
site_author: Process Intelligence Research
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - Architecture: architecture.md
  - Diagram Rendering: diagram_rendering.md
  - pyDEXPI Integration: pydexpi_integration.md
  - Limitations: limitations.md
  - Roadmap: roadmap.md
  - Releasing: releasing.md
  - Changelog: changelog.md
