name: Release Build

on:
  push:
    tags:
      - "v*"
  # Build without a tag, e.g. to try the release builds of a branch. The artifacts are
  # the same; only a tag build is meant to be attached to a GitHub release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to name the artifacts, e.g. 0.1.0"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Qt's libraries load the system's OpenGL, EGL and xkbcommon libraries even
      # without a display, and the Ubuntu runner does not have them.
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller pip-licenses

      - name: Build release artifact
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          # The tests the release script runs first open windows; no runner has a display.
          QT_QPA_PLATFORM: offscreen
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          python scripts/release.py --version "$VERSION"
          # To enable code signing, add --sign to the command above and configure
          # the relevant secrets in Settings → Secrets and variables → Actions.
          # See docs/releasing.md for details.

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: dexpi-studio-${{ matrix.os }}
          path: |
            release/*.zip
            release/*.sha256
